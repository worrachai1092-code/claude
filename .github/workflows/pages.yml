name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/stock-trading-calculator-tf1qob]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publishing to a gh-pages branch auto-enables Pages hosting on public
      # repos, which the Actions-based deploy API is not permitted to do here.
      - name: Publish app files to gh-pages branch
        run: |
          mkdir site
          cp index.html manifest.webmanifest sw.js icon-*.png site/
          touch site/.nojekyll
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
